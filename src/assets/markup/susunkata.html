<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kyyinfinite Susun Kata</title>

<style>
:root{
  --bg:transparent;
  --card:transparent;
  --card-2:#2a3942;
  --ink:#e9edef;
  --ink-soft:#aebac1;
  --muted:#8696a0;
  --accent:#00a884;
  --accent-2:#008069;
  --line:#2a3942;
  --line-strong:#374248;
  --cell-bg:#111b21;
  --gold:#ffcb47;
  --gold-2:#f2a900;
  --danger:#f15c5c;
  --sys:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  background:transparent;
  color:var(--ink);
  font-family:var(--sys);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

button{
  font-family:inherit;
}

svg{
  display:block;
}

.stage{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}

.card{
  width:100%;
  max-width:360px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
  gap:8px;
}

.header__text{
  display:flex;
  flex-direction:column;
}

.header__title{
  font-size:17px;
  font-weight:600;
  color:var(--ink);
  letter-spacing:-.005em;
}

.header__sub{
  font-size:12px;
  color:var(--muted);
}

.icon-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--cell-bg);
  border:1px solid var(--line-strong);
  color:var(--ink-soft);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:color .15s ease,border-color .15s ease;
}

.icon-btn svg{
  width:17px;
  height:17px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon-btn:hover{
  color:var(--ink);
  border-color:var(--ink-soft);
}

.icon-btn:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:1px;
}

.status{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:13px;
  gap:8px;
}

.status__turn{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink-soft);
}

.status__indicator{
  width:20px;
  height:20px;
  color:var(--muted);
  transition:color .2s ease;
  flex-shrink:0;
}

.status__indicator svg{
  width:100%;
  height:100%;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.status__indicator.is-hot{
  color:var(--gold);
}

.coin-badge{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--cell-bg);
  border:1px solid var(--line-strong);
  border-radius:20px;
  padding:5px 12px 5px 8px;
  position:relative;
}

.coin-badge svg{
  width:18px;
  height:18px;
  stroke:var(--gold);
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.coin-badge b{
  color:var(--ink);
  font-weight:700;
  font-variant-numeric:tabular-nums;
  font-size:13px;
}

.timerbar{
  height:5px;
  border-radius:3px;
  background:var(--line);
  overflow:hidden;
  margin-bottom:14px;
}

.timerbar__fill{
  height:100%;
  width:100%;
  background:var(--accent);
  border-radius:3px;
  transition:width .1s linear,background .3s ease;
}

.timerbar__fill.is-low{
  background:var(--danger);
}

.clue{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--cell-bg);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:16px;
  min-height:52px;
}

.clue__icon{
  width:22px;
  height:22px;
  color:var(--accent);
  flex-shrink:0;
}

.clue__icon svg{
  width:100%;
  height:100%;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.clue__text{
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.45;
}

.slots{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
  margin-bottom:20px;
  min-height:46px;
  transition:transform .12s ease;
}

.slot{
  width:38px;
  height:44px;
  border-radius:8px;
  border:1.5px dashed var(--line-strong);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:700;
  color:var(--ink);
  cursor:default;
  user-select:none;
  transition:border-color .15s ease,background .15s ease,transform .15s ease;
}

.slot.is-filled{
  border-style:solid;
  border-color:var(--accent);
  background:rgba(0,168,132,.12);
  cursor:pointer;
  animation:slotPop .18s ease-out;
}

@keyframes slotPop{
  0%{transform:scale(.7)}
  100%{transform:scale(1)}
}

.slots.is-correct .slot.is-filled{
  border-color:var(--accent);
  background:rgba(0,168,132,.28);
  color:var(--accent);
}

.slots.is-wrong{
  animation:shake .4s ease;
}

.slots.is-wrong .slot.is-filled{
  border-color:var(--danger);
  background:rgba(241,92,92,.18);
  color:var(--danger);
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(3px)}
}

.tiles{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-bottom:18px;
  min-height:46px;
}

.tile{
  width:40px;
  height:46px;
  border-radius:10px;
  background:var(--cell-bg);
  border:1px solid var(--line-strong);
  color:var(--ink);
  font-size:19px;
  font-weight:700;
  cursor:pointer;
  transition:transform .1s ease,border-color .15s ease,visibility 0s,opacity .15s ease;
}

.tile:hover{
  border-color:var(--ink-soft);
}

.tile:active{
  transform:scale(.92);
}

.tile:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:1px;
}

.tile.is-placed{
  visibility:hidden;
}

.levels{
  margin-top:2px;
}

.levels__label{
  font-size:11px;
  color:var(--muted);
  margin-bottom:8px;
}

.levels__list{
  display:flex;
  flex-wrap:nowrap;
  gap:8px;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  -ms-overflow-style:none;
  padding:2px 2px 6px;
  margin:0 -2px;
}

.levels__list::-webkit-scrollbar{
  display:none;
}

.level{
  display:flex;
  align-items:center;
  gap:6px;
  background:transparent;
  border:1px solid var(--line-strong);
  border-radius:20px;
  padding:9px 16px;
  font-size:13px;
  font-weight:500;
  color:var(--ink-soft);
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
  transition:color .15s ease,border-color .15s ease,background .15s ease;
}

.level svg{
  width:15px;
  height:15px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.level:hover{
  color:var(--ink);
  border-color:var(--ink-soft);
}

.level.is-active{
  background:var(--accent);
  border-color:var(--accent);
  color:#0b141a;
}

.level:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:1px;
}

.footer{
  margin-top:14px;
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.action{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  background:none;
  border:none;
  color:var(--ink-soft);
  font-size:11px;
  font-weight:500;
  cursor:pointer;
  padding:8px 4px;
  border-radius:10px;
  transition:color .15s ease,background .15s ease;
}

.action svg{
  width:19px;
  height:19px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.action:hover{
  color:var(--ink);
  background:var(--cell-bg);
}

.action:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:1px;
}

.action.is-shake{
  animation:shake .4s ease;
}

.coinpop{
  position:absolute;
  right:10px;
  top:-4px;
  color:var(--gold);
  font-weight:700;
  font-size:13px;
  animation:coinFloat 1s ease-out forwards;
  pointer-events:none;
}

@keyframes coinFloat{
  0%{
    opacity:0;
    transform:translateY(0);
  }
  15%{
    opacity:1;
  }
  100%{
    opacity:0;
    transform:translateY(-26px);
  }
}

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease;
}

.modal.is-open{
  opacity:1;
  pointer-events:auto;
}

.modal__backdrop{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.5);
}

.modal__card{
  position:relative;
  background:var(--card-2);
  border-radius:12px;
  padding:26px 24px 0;
  text-align:center;
  max-width:320px;
  width:100%;
  box-shadow:0 24px 50px -12px rgba(0,0,0,.6);
  transform:translateY(8px) scale(.96);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
}

.modal.is-open .modal__card{
  transform:translateY(0) scale(1);
}

.modal__icon{
  width:46px;
  height:46px;
  color:var(--gold);
  margin:0 auto 12px;
}

.modal__icon svg{
  width:100%;
  height:100%;
  stroke:currentColor;
  fill:none;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.modal__title{
  font-size:20px;
  font-weight:700;
  letter-spacing:-.015em;
  color:var(--ink);
  margin-bottom:8px;
  line-height:1.25;
}

.modal__sub{
  font-size:14px;
  color:var(--muted);
  margin-bottom:20px;
  line-height:1.45;
}

.modal__retry{
  background:transparent;
  border:none;
  color:var(--accent);
  font-size:16px;
  font-weight:600;
  letter-spacing:-.005em;
  cursor:pointer;
  padding:14px 24px;
  width:100%;
  border-top:1px solid var(--line-strong);
  transition:color .15s ease;
}

.modal__retry:hover{
  color:var(--ink);
}

.modal__retry:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:-2px;
}

@media (max-width:380px){
  .stage{
    padding:16px 12px;
  }

  .level{
    padding:8px 13px;
    font-size:12px;
  }

  .tile{
    width:36px;
    height:42px;
    font-size:17px;
  }

  .slot{
    width:34px;
    height:40px;
    font-size:17px;
  }

  .modal__title{
    font-size:18px;
  }
}

@media (prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<main class="stage">
  <div class="card">

    <div class="header">
      <div class="header__text">
        <div class="header__title">kyyinfinite Susun Kata</div>
        <div class="header__sub">Susun huruf jadi kata</div>
      </div>

      <button
        class="icon-btn"
        id="soundToggle"
        aria-label="Suara"
        type="button">
      </button>
    </div>

    <div class="status" aria-live="polite">

      <div class="status__turn">
        <span
          class="status__indicator"
          id="streakDot">
        </span>

        <span id="statusText">
          Ronde 1 • Kata 1/5
        </span>
      </div>

      <div
        class="coin-badge"
        id="coinBadge">

        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>

        <b id="coinCount">0</b>
      </div>

    </div>

    <div class="timerbar">
      <div
        class="timerbar__fill"
        id="timerFill">
      </div>
    </div>

    <div class="clue">

      <span
        class="clue__icon"
        id="clueIcon">
      </span>

      <span
        class="clue__text"
        id="clueText">
        Memuat kata…
      </span>

    </div>

    <div
      class="slots"
      id="slots"
      role="group"
      aria-label="Jawaban">
    </div>

    <div
      class="tiles"
      id="tiles"
      role="group"
      aria-label="Huruf tersedia">
    </div>

    <div class="levels">

      <div class="levels__label">
        Kategori
      </div>

      <div
        class="levels__list"
        id="levelsList"
        role="radiogroup"
        aria-label="Kategori kata">
      </div>

    </div>

    <div class="footer">

      <button
        class="action"
        id="btnShuffle"
        type="button">
      </button>

      <button
        class="action"
        id="btnHint"
        type="button">
      </button>

      <button
        class="action"
        id="btnSkip"
        type="button">
      </button>

    </div>

  </div>
</main>

<div
  class="modal"
  id="modal"
  hidden>

  <div
    class="modal__backdrop"
    id="modalBackdrop">
  </div>

  <div
    class="modal__card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle">

    <div class="modal__icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.5-2-1-3 1 .5 3 2 3 5a5 5 0 0 1-10 0c0-5 3-6 5-11z"/>
      </svg>
    </div>

    <h2
      class="modal__title"
      id="modalTitle">
      Ronde Selesai
    </h2>

    <p
      class="modal__sub"
      id="modalSub">
      Kamu mengumpulkan koin.
    </p>

    <button
      class="modal__retry"
      id="modalRetry"
      type="button">
      Lanjut
    </button>

  </div>
</div>

/* =========================================================

function safeStorageGet(key,fallback){

  try{

    if(
      typeof window==='undefined' ||
      !window.localStorage
    ){
      return fallback;
    }

    const value=window.localStorage.getItem(key);

    return value===null ? fallback : value;

  }catch(e){

    return fallback;

  }

}

function safeStorageSet(key,value){

  try{

    if(
      typeof window==='undefined' ||
      !window.localStorage
    ){
      return false;
    }

    window.localStorage.setItem(key,String(value));

    return true;

  }catch(e){

    return false;

  }

}

let audioCtx=null;

function ensureAudio(){

  if(audioCtx){
    return audioCtx;
  }

  const AudioCtor=
    window.AudioContext||
    window.webkitAudioContext;

  if(!AudioCtor){
    return null;
  }

  try{

    audioCtx=new AudioCtor();

    if(audioCtx.state==='suspended'){

      const promise=audioCtx.resume();

      if(
        promise &&
        typeof promise.catch==='function'
      ){
        promise.catch(()=>{
          audioCtx=null;
        });
      }

    }

    return audioCtx;

  }catch(e){

    audioCtx=null;

    return null;

  }

}

function tone(
  freq,
  start,
  duration,
  type,
  peak
){

  if(!state.soundOn){
    return;
  }

  const ac=ensureAudio();

  if(!ac){
    return;
  }

  try{

    const t0=
      ac.currentTime+
      start;

    const osc=
      ac.createOscillator();

    const gain=
      ac.createGain();

    osc.type=type;

    osc.frequency.setValueAtTime(
      freq,
      t0
    );

    gain.gain.setValueAtTime(
      0,
      t0
    );

    gain.gain.linearRampToValueAtTime(
      peak,
      t0+0.018
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      t0+duration
    );

    osc.connect(gain);

    gain.connect(
      ac.destination
    );

    osc.start(t0);

    osc.stop(
      t0+
      duration+
      0.03
    );

  }catch(e){}

}

/* =========================================================
   HELPERS
========================================================= */

function shuffleArr(arr){

  const a=arr.slice();

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }

  return a;

}

function scrambleWord(word){

  const base=
    word
      .split('')
      .map(
        (c,i)=>({
          id:i,
          char:c,
          placed:false
        })
      );

  let arr;

  let attempts=0;

  do{

    arr=
      shuffleArr(base)
      .map(
        l=>({
          id:l.id,
          char:l.char,
          placed:false
        })
      );

    attempts++;

    if(attempts>20){
      break;
    }

  }while(
    word.length>1 &&
    arr.map(
      l=>l.char
    ).join('')===word
  );

  return arr;

}

      b.addEventListener(

          selectCategory(i);
        }
      );

      levelsList.appendChild(b);

    }
  );

}

function selectCategory(i){

  if(
    !CATEGORIES[i]
  ){
    return;
  }

  clearTimer();

  state.categoryIndex=i;

  state.category=
    CATEGORIES[i];

  document
    .querySelectorAll('.level')
    .forEach(
      (el,idx)=>{

        const on=
          idx===i;

        el.classList.toggle(
          'is-active',
          on
        );

        el.setAttribute(
          'aria-checked',
          on?'true':'false'
        );

      }
    );

}

function updateTimerBar(){

    !state.maxTime ||
    state.maxTime<=0
  ){

    timerFill.style.width='0%';

    return;

  }

  const pct=
    Math.max(
      0,
      Math.min(
        100,
        state.timeLeft/
        state.maxTime*
        100
      )
    );

  timerFill.style.width=
    pct+'%';

  timerFill.classList.toggle(
    'is-low',
    pct<30
  );

}

function popCoin(amount){

    document.createElement(

/* =========================================================
   TIMER
========================================================= */

function clearTimer(){

  if(state.timerHandle){

    clearInterval(
      state.timerHandle
    );

    state.timerHandle=null;

  }

}

function startTimer(){

  clearTimer();

  state.timeLeft=
    state.maxTime;

  updateTimerBar();

  state.timerHandle=
    setInterval(
      ()=>{

        state.timeLeft-=0.1;

        if(
          state.timeLeft<=0
        ){

          state.timeLeft=0;

          updateTimerBar();

          clearTimer();

          timeUp();

          return;

        }

        updateTimerBar();

      },
      100
    );

}


/* =========================================================
   GAME FLOW
========================================================= */

function startRound(){

  clearTimer();

  state.round=
    (state.round||0)+1;

  state.wordIndex=0;

  state.roundScore=0;

  state.streak=0;

  state.queue=
    shuffleArr(
      state.category.words
    );

  hideModal();

  nextWord();

}

function nextWord(){

  clearTimer();

  slotsEl.classList.remove(
    'is-correct',
    'is-wrong'
  );

  if(
    state.wordIndex>=ROUND_LENGTH
  ){

    showRoundModal();

    return;

  }

  if(
    state.queue.length===0
  ){

    state.queue=
      shuffleArr(
        state.category.words
      );

  }

  state.currentWord=
    state.queue.pop();

  if(
    !state.currentWord
  ){

    state.wordIndex++;

    nextWord();

    return;

  }

  state.letters=
    scrambleWord(
      state.currentWord.word
    );

  state.slots=
    new Array(
      state.currentWord.word.length
    ).fill(null);

  state.maxTime=
    8+
    state.currentWord.word.length*
    1.6;

  state.timeLeft=
    state.maxTime;

  clueTextEl.textContent=
    state.currentWord.hint;

  clueIconEl.innerHTML=
    state.category.icon;

  renderTiles();

  renderSlots();

  updateHeader();

  startTimer();

}

function onTileClick(id){

  const letter=
    state.letters.find(
      l=>l.id===id
    );

  if(
    !letter||
    letter.placed
  ){
    return;
  }

  const idx=
    state.slots.findIndex(
      s=>s===null
    );

  if(idx===-1){
    return;
  }

  state.slots[idx]={
    id:letter.id,
    char:letter.char
  };

  letter.placed=true;

  sfx.tap();

  renderTiles();

  renderSlots();

  if(
    state.slots.every(
      s=>s!==null
    )
  ){

    setTimeout(
      checkAnswer,
      200
    );

  }

}

function onSlotClick(idx){

  if(
    !state.slots[idx]
  ){
    return;
  }

  const removed=
    state.slots[idx];

  for(
    let j=idx;
    j<state.slots.length-1;
    j++
  ){

    state.slots[j]=
      state.slots[j+1];

  }

  state.slots[
    state.slots.length-1
  ]=null;

  const letter=
    state.letters.find(
      l=>l.id===removed.id
    );

  if(letter){
    letter.placed=false;
  }

  slotsEl.classList.remove(
    'is-correct',
    'is-wrong'
  );

  sfx.tap();

  renderTiles();

  renderSlots();

}

function checkAnswer(){

  if(
    !state.currentWord
  ){
    return;
  }

  const guess=
    state.slots
      .map(
        s=>s?s.char:''
      )
      .join('');

  if(
    guess===
    state.currentWord.word
  ){

    correctAnswer();

  }else{

    wrongAnswer();

  }

}

function correctAnswer(){

  clearTimer();

  slotsEl.classList.remove(
    'is-wrong'
  );

  slotsEl.classList.add(
    'is-correct'
  );

  const bonusTime=
    Math.ceil(
      state.timeLeft
    );

  const earned=
    5+
    Math.floor(
      bonusTime/2
    )+
    state.streak*2;

  state.streak++;

  state.coins+=earned;

  state.roundScore+=earned;

  saveCoins();

  sfx.correct();

  setTimeout(
    sfx.coin,
    150
  );

  updateHeader();

  popCoin(earned);

  setTimeout(
    ()=>{

      state.wordIndex++;

      nextWord();

    },
    900
  );

}

function wrongAnswer(){

  if(
    !state.currentWord
  ){
    return;
  }

  clearTimer();

  slotsEl.classList.remove(
    'is-wrong'
  );

  void slotsEl.offsetWidth;

  slotsEl.classList.add(
    'is-wrong'
  );

  sfx.wrong();

  state.streak=0;

  updateHeader();

  setTimeout(
    ()=>{

      slotsEl.classList.remove(
        'is-wrong'
      );

      state.slots.forEach(
        s=>{

          if(s){

            const l=
              state.letters.find(
                x=>x.id===s.id
              );

            if(l){
              l.placed=false;
            }

          }

        }
      );

      state.slots=
        new Array(
          state.currentWord.word.length
        ).fill(null);

      renderTiles();

      renderSlots();

      startTimer();

    },
    500
  );

}

function timeUp(){

  if(
    !state.currentWord
  ){
    return;
  }

  clearTimer();

  slotsEl.classList.remove(
    'is-wrong'
  );

  void slotsEl.offsetWidth;

  slotsEl.classList.add(
    'is-wrong'
  );

  sfx.wrong();

  state.streak=0;

  updateHeader();

  setTimeout(
    ()=>{

      state.wordIndex++;

      nextWord();

    },
    700
  );

}

function showRoundModal(){

  clearTimer();

  modalTitle.textContent=
    'Ronde Selesai';

  modalSub.textContent=
    'Kamu mengumpulkan '+
    state.roundScore+
    ' koin di ronde ini. Total koin: '+
    state.coins+
    '.';

  sfx.round();

  modal.hidden=false;

  void modal.offsetWidth;

  modal.classList.add(
    'is-open'
  );

  setTimeout(
    ()=>{
      try{
        modalRetry.focus();
      }catch(e){}
    },
    80
  );

}

function hideModal(){

  modal.classList.remove(
    'is-open'
  );

  setTimeout(
    ()=>{

      if(
        !modal.classList.contains(
          'is-open'
        )
      ){
        modal.hidden=true;
      }

    },
    350
  );

}


/* =========================================================
   FOOTER ACTIONS
========================================================= */

btnShuffle.addEventListener(
  'click',
  ()=>{

    if(
      !state.letters.length
    ){
      return;
    }

    const empty=
      state.letters.filter(
        l=>!l.placed
      );

    const shuffled=
      shuffleArr(empty);

    let k=0;

    state.letters=
      state.letters.map(
        l=>
          l.placed
            ? l
            : shuffled[k++]
      );

    sfx.tap();

    renderTiles();

  }
);


btnHint.addEventListener(
  'click',
  ()=>{

    if(
      !state.currentWord
    ){
      return;
    }

    if(
      state.coins<10
    ){

      btnHint.classList.add(
        'is-shake'
      );

      setTimeout(
        ()=>{
          btnHint.classList.remove(
            'is-shake'
          );
        },
        400
      );

      return;

    }

    const emptyIdx=
      state.slots.findIndex(
        s=>s===null
      );

    if(
      emptyIdx===-1
    ){
      return;
    }

    const correctChar=
      state.currentWord.word[
        emptyIdx
      ];

    const letter=
      state.letters.find(
        l=>
          !l.placed&&
          l.char===correctChar
      );

    if(!letter){

      return;

    }

    state.coins-=10;

    saveCoins();

    state.slots[
      emptyIdx
    ]={
      id:letter.id,
      char:letter.char
    };

    letter.placed=true;

    sfx.hint();

    updateHeader();

    renderTiles();

    renderSlots();

    if(
      state.slots.every(
        s=>s!==null
      )
    ){

      setTimeout(
        checkAnswer,
        200
      );

    }

  }
);


btnSkip.addEventListener(
  'click',
  ()=>{

    clearTimer();

    state.streak=0;

    updateHeader();

    state.wordIndex++;

    nextWord();

  }
);


/* =========================================================
   MODAL
========================================================= */

modalRetry.addEventListener(
  'click',
  ()=>{
    startRound();
  }
);

modalBackdrop.addEventListener(
  'click',
  ()=>{
    startRound();
  }
);

document.addEventListener(
  'keydown',
  e=>{

    if(
      !modal.classList.contains(
        'is-open'
      )
    ){
      return;
    }

    if(
      e.key==='Escape'||
      e.key==='Enter'
    ){

      e.preventDefault();

      startRound();

    }

  }
);


/* =========================================================
   INIT
========================================================= */

renderSoundIcon();

buildLevels();

updateHeader();

startRound();

})();
